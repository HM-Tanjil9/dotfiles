# ==========================================================
# TMUX CONFIG
# Omarchy + Transparent Status + Nerd Font Icons
# No Catppuccin dependency
# ==========================================================


# ==========================================================
# RESET
# ==========================================================

source-file ~/.config/tmux/tmux.reset.conf


# ==========================================================
# TERMINAL
# ==========================================================

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB,alacritty:RGB'
set -as terminal-features ',xterm-256color:RGB,alacritty:RGB'

# True color
#set -as terminal-overrides ',xterm-256color:RGB'

# OSC52 clipboard
set -as terminal-overrides ',xterm*:XT:Ms=\E]52;%p1%s;%p2%s\007'

# Alternate screen fixes
set -as terminal-overrides ',xterm*:smcup@:rmcup@'
set -as terminal-overrides ',tmux*:smcup@:rmcup@'

set -g focus-events on
set -g set-clipboard on


# ==========================================================
# GENERAL
# ==========================================================

# Ctrl+A prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1

set -g detach-on-destroy off
set -g escape-time 0

set -g history-limit 1000000

set -g renumber-windows on

set -g mouse on

setw -g mode-keys vi


# ==========================================================
# WINDOW NAMES
# ==========================================================

set -g automatic-rename on
set -g allow-rename on


# ==========================================================
# TRANSPARENT BACKGROUND
# ==========================================================

# set -g window-style "bg=default"
set -g window-active-style "bg=default"

set -g status-style "bg=default,fg=default"

# Hide/blend pane separator lines
set -g pane-border-status off
set -g pane-border-style "fg=default,bg=default"
set -g pane-active-border-style "fg=default,bg=default"


# ==========================================================
# STATUS BAR
# ==========================================================

set -g status on
set -g status-position top
set -g status-interval 5

set -g status-left-length 100
set -g status-right-length 200


# ----------------------------------------------------------
# LEFT: SESSION
# 🐣 0
# ----------------------------------------------------------

set -g status-left '#{?client_prefix,#[bg=colour1],#[bg=colour2]}#[fg=colour0,bold] 🐣 #S #[bg=default,fg=default]#{?client_prefix,#[fg=colour1],#[fg=colour2]}#[default] '


# ----------------------------------------------------------
# INACTIVE WINDOWS
# 1 zsh
# ----------------------------------------------------------

setw -g window-status-style \
"bg=default,fg=colour7"

setw -g window-status-format \
"#[bg=colour0,fg=colour7] #I #[fg=colour7]#W #[bg=default,fg=colour0]#[default] "


# ----------------------------------------------------------
# ACTIVE WINDOW
# 1 zsh
# ----------------------------------------------------------

setw -g window-status-current-style \
"bg=default,fg=colour7,bold"

setw -g window-status-current-format \
"#[bg=colour3,fg=colour0,bold] #I #[bg=colour0,fg=colour3]#[bg=colour0,fg=colour7,bold] #W #[bg=default,fg=colour0]#[default] "


# ----------------------------------------------------------
# RIGHT SIDE
#
# 👤 scream   📁 /home/scream   🕒 12:30
# ----------------------------------------------------------

set -g status-right \
"#[bg=colour6,fg=colour0,bold] 󰀄 #[bg=colour0,fg=colour6]#[bg=colour0,fg=colour7] #(whoami) #[bg=default,fg=colour0] \
#[bg=colour5,fg=colour0,bold]  #[bg=colour0,fg=colour5]#[bg=colour0,fg=colour7] #{pane_current_path} #[bg=default,fg=colour0] \
#[bg=colour4,fg=colour0,bold] 󰥔 #[bg=colour0,fg=colour4]#[bg=colour0,fg=colour7] %H:%M #[bg=default,fg=colour0]#[default]"


# ==========================================================
# COPY MODE
# ==========================================================

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# ==========================================================
# SPLITS
# Keep current directory
# ==========================================================

bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"


# ==========================================================
# FZF URL
# ==========================================================

set -g @fzf-url-fzf-options \
'-p 60%,30% --prompt="   " --border-label=" Open URL "'

set -g @fzf-url-history-limit '2000'


# ==========================================================
# PLUGINS
# ==========================================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'


# ==========================================================
# SESSIONX
# ==========================================================

set -g @sessionx-pointer "▶ "

set -g @sessionx-bind 'o'

set -g @sessionx-bind-zo-new-window 'ctrl-y'

set -g @sessionx-auto-accept 'off'

set -g @sessionx-custom-paths \
"$HOME/Developer,$HOME/Downloads"

set -g @sessionx-x-path '~/.config'

set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

set -g @sessionx-zoxide-mode 'on'

set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @sessionx-ls-command \
'lsd --tree --color=always --icon=always'


# ==========================================================
# FLOAX
# ==========================================================

set -g @floax-width '80%'
set -g @floax-height '80%'

set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'

set -g @floax-bind 'p'

set -g @floax-change-path 'true'


# ==========================================================
# RESURRECT / CONTINUUM
# ==========================================================

set -g @continuum-restore 'off'

set -g @resurrect-strategy-nvim 'session'


# ==========================================================
# RELOAD
# ==========================================================

bind R \
    source-file ~/.config/tmux/tmux.conf \; \
    display-message "Tmux config reloaded!"


# ==========================================================
# TPM
# Keep this LAST
# ==========================================================

run '~/.tmux/plugins/tpm/tpm'
# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

